{{- if .Values.cloudArmor.securityPolicy }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "service-marketplace.fullname" . }}-backend
  labels:
    {{- include "service-marketplace.labels" . | nindent 4 }}
spec:
  securityPolicy:
    name: {{ .Values.cloudArmor.securityPolicy | quote }}
{{- end }}
