apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-marketplace.fullname" . }}-config
  labels:
    {{- include "service-marketplace.labels" . | nindent 4 }}
data:
  application-helm.yml: |
    marketplace:
      publish-oidc-trust:
        audience: {{ .Values.publishOidcTrust.audience | quote }}
        allowed-sources:
{{- if .Values.publishOidcTrust.allowedSources }}
{{- range $repo, $pluginId := .Values.publishOidcTrust.allowedSources }}
          {{ $repo | quote }}: {{ $pluginId | quote }}
{{- end }}
{{- else }}
          {}
{{- end }}
