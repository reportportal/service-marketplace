apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-marketplace.fullname" . }}
  labels:
    {{- include "service-marketplace.labels" . | nindent 4 }}
  {{- if .Values.cloudArmor.securityPolicy }}
  annotations:
    cloud.google.com/backend-config: '{"default":"{{ include "service-marketplace.fullname" . }}-backend"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "service-marketplace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
