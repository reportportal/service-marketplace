apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-marketplace.fullname" . }}
  labels:
    {{- include "service-marketplace.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service-marketplace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "service-marketplace.labels" . | nindent 8 }}
    spec:
      containers:
        - name: service-marketplace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/
            - name: SPRING_PROFILES_ACTIVE
              value: helm
            - name: STORAGE_TYPE
              value: {{ .Values.storage.type | quote }}
            - name: GCS_BUCKET
              value: {{ .Values.gcs.bucket | quote }}
            - name: GCS_LOCATION
              value: {{ .Values.gcs.location | quote }}
            - name: CDN_BASE_URL
              value: {{ .Values.cdn.baseUrl | quote }}
            - name: CDN_URL_MAP
              value: {{ .Values.cdn.urlMap | quote }}
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-marketplace.fullname" . }}-secret
                  key: admin-username
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-marketplace.fullname" . }}-secret
                  key: admin-password-hash
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-marketplace.fullname" . }}-secret
                  key: jwt-secret
            - name: JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            - name: JWT_TTL_SECONDS
              value: {{ .Values.jwt.ttlSeconds | quote }}
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-marketplace.fullname" . }}-secret
                  key: github-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "service-marketplace.fullname" . }}-secret
                  key: github-client-secret
            - name: GITHUB_OAUTH_ALLOWED_ORG
              value: {{ .Values.githubOAuth.allowedOrg | quote }}
            - name: GITHUB_OAUTH_ALLOWED_TEAM
              value: {{ .Values.githubOAuth.allowedTeam | quote }}
            - name: GITHUB_OAUTH_REDIRECT_URI
              value: {{ .Values.githubOAuth.redirectUri | quote }}
            - name: PUBLISH_OIDC_AUDIENCE
              value: {{ .Values.publishOidcTrust.audience | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "service-marketplace.fullname" . }}-config
