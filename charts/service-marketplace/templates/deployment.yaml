apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service-marketplace.fullname" . }}
  labels:
    app.kubernetes.io/name: service-marketplace
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: service-marketplace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-marketplace
    spec:
      containers:
        - name: marketplace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "service-marketplace.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
