replicaCount: 1

image:
  repository: reportportal/service-marketplace
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: marketplace.local
      paths:
        - path: /
          pathType: Prefix

env:
  HTTP_ADDR: ":8080"
  STORAGE_TYPE: local
  STORAGE_LOCAL_ROOT: /data
  CDN_BASE_URL: "http://marketplace.local/cdn"
  CDN_URL_MAP: ""
  GCP_PROJECT: ""
  ADMIN_LOGIN_ENABLED: "true"
  JWT_ISSUER: service-marketplace
  # Set to "1" only behind an ingress that strips/forwards X-Forwarded-For.
  TRUSTED_PROXY_HOPS: "0"
  PUBLISH_OIDC_AUDIENCE: "marketplace.reportportal.io"
  PUBLISH_OIDC_ALLOWED_SOURCES: "{}"
  GA4_MEASUREMENT_ID: ""
  GA4_API_SECRET: ""
  # JWT_SECRET and STORAGE_SIGNING_SECRET must come from a Kubernetes Secret (see secrets below).
  # Do not set ALLOW_INSECURE_DEFAULTS in production.

secrets:
  # Create a Secret named service-marketplace-secrets with keys:
  #   JWT_SECRET, STORAGE_SIGNING_SECRET, ADMIN_PASSWORD_HASH (optional)
  existingSecret: service-marketplace-secrets

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

resources: {}
