replicaCount: 1

image:
  repository: reportportal/service-marketplace
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: marketplace.local
      paths:
        - path: /
          pathType: Prefix

env:
  HTTP_ADDR: ":8080"
  STORAGE_TYPE: local
  STORAGE_LOCAL_ROOT: /data
  # Must resolve to the registry's own /cdn handler (keep the /cdn suffix): signed
  # premium URLs are verified there, and the registry checks this after startup
  # (reported in /ready as checks.cdn). A CDN may cache in front of /cdn.
  CDN_BASE_URL: "http://marketplace.local/cdn"
  # Set to "false" if pods cannot reach their own public host.
  CDN_SELF_CHECK: "true"
  CDN_URL_MAP: ""
  GCP_PROJECT: ""
  ADMIN_LOGIN_ENABLED: "true"
  JWT_ISSUER: service-marketplace
  # Set to "1" only behind an ingress that strips/forwards X-Forwarded-For.
  TRUSTED_PROXY_HOPS: "0"
  PUBLISH_OIDC_AUDIENCE: "marketplace.reportportal.io"
  # source → pluginId. GitHub: owner/repo. GitLab: project_path.
  PUBLISH_OIDC_ALLOWED_SOURCES: '{"EPM-RPP/plugin-billing-epam":"billing"}'
  # Empty issuer disables GitLab CI OIDC. GitHub Actions stays accepted either way.
  PUBLISH_OIDC_GITLAB_ISSUER: "https://git.epam.com"
  # Optional. Empty uses <issuer>/oauth/discovery/keys.
  PUBLISH_OIDC_GITLAB_JWKS_URL: ""
  GA4_MEASUREMENT_ID: ""
  GA4_API_SECRET: ""
  # JWT_SECRET and STORAGE_SIGNING_SECRET must come from a Kubernetes Secret (see secrets below).
  # Do not set ALLOW_INSECURE_DEFAULTS in production.

secrets:
  # Create a Secret named service-marketplace-secrets with keys:
  #   JWT_SECRET, STORAGE_SIGNING_SECRET, ADMIN_PASSWORD_HASH (optional)
  existingSecret: service-marketplace-secrets

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

resources: {}
