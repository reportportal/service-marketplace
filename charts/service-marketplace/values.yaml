replicaCount: 1

# Pod and container security contexts align with the non-root UID/GID in the Dockerfile (1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

image:
  repository: reportportal/service-marketplace
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

gcs:
  bucket: reportportal-marketplace
  privateBucket: reportportal-marketplace-private
  location: us-east1

cdn:
  baseUrl: https://cdn.marketplace.reportportal.io
  urlMap: marketplace-url-map

storage:
  type: gcs

admin:
  username: admin
  # bcrypt hash — generate with: ./gradlew genAdminHash --args='your-password'
  passwordHash: ""

jwt:
  secret: ""
  issuer: marketplace.reportportal.io
  ttlSeconds: 28800

githubOAuth:
  clientId: ""
  clientSecret: ""
  allowedOrg: reportportal
  allowedTeam: ""
  redirectUri: https://marketplace.reportportal.io/api/v1/auth/github/callback
  oauthStateTtlSeconds: 600

publishOidcTrust:
  audience: marketplace.reportportal.io
  # Map GitHub repository (owner/name) -> plugin id
  allowedSources: {}
  # example:
  #   reportportal/plugin-jira-cloud: plugin-jira-cloud

# Optional GKE Cloud Armor attachment. When set, the chart creates a BackendConfig and
# annotates the Service. Create the named security policy in GCP yourself (rate-based-ban
# on POST /api/v1/auth/login); the chart never creates project-level Cloud Armor resources.
cloudArmor:
  securityPolicy: ""

env: {}
