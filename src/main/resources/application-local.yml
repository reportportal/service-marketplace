# Local profile: filesystem storage + embedded CDN proxy at /cdn/** (LocalCdnController).
# CDN_BASE_URL must match the base used in catalogue responses (default below).
marketplace:
  storage:
    type: local
    local:
      root: ./data/marketplace
  cdn:
    base-url: http://localhost:8080/cdn
  auth:
    admin:
      username: admin
      password-hash: $2a$10$bbdLQFSI9d1QNOxWBerBceaVlOSl30P8PGK7i7bPG9bQ8jOVQIrja
    jwt:
      secret: local-dev-jwt-secret-key-min-32-chars!!
      ttl-seconds: 28800
    github:
      client-id: ""
      client-secret: ""
      allowed-org: reportportal
      redirect-uri: http://localhost:8080/api/v1/auth/github/callback

logging:
  level:
    com.epam.reportportal.marketplace: DEBUG
