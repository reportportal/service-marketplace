spring:
  # No default profile: a jar started without configuration must fail closed rather than fall
  # back to the development credentials in application-local.yml. Use SPRING_PROFILES_ACTIVE.
  servlet:
    multipart:
      # Publish bundles are plugin jars, not small forms. The Boot defaults (1MB file /
      # 10MB request) reject every realistic bundle. 128MB matches the instance-level
      # plugin upload limit; the request budget adds changelog + 5 screenshots (2MB each).
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:128MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:160MB}

server:
  port: 8080

marketplace:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root: ${STORAGE_LOCAL_ROOT:./data/marketplace}
  gcs:
    bucket: ${GCS_BUCKET:reportportal-marketplace}
    private-bucket: ${GCS_PRIVATE_BUCKET:reportportal-marketplace-private}
    location: ${GCS_LOCATION:US}
  cdn:
    base-url: ${CDN_BASE_URL:http://localhost:8080/cdn}
    url-map: ${CDN_URL_MAP:}
  auth:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
      lockout-seconds: ${LOGIN_RATE_LIMIT_LOCKOUT_SECONDS:60}
      backoff-multiplier: ${LOGIN_RATE_LIMIT_BACKOFF_MULTIPLIER:2.0}
      max-lockout-seconds: ${LOGIN_RATE_LIMIT_MAX_LOCKOUT_SECONDS:900}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:marketplace.reportportal.io}
      ttl-seconds: ${JWT_TTL_SECONDS:28800}
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      allowed-org: ${GITHUB_OAUTH_ALLOWED_ORG:reportportal}
      allowed-team: ${GITHUB_OAUTH_ALLOWED_TEAM:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
      oauth-state-ttl-seconds: ${GITHUB_OAUTH_STATE_TTL_SECONDS:600}
  publish-oidc-trust:
    audience: ${PUBLISH_OIDC_AUDIENCE:marketplace.reportportal.io}
    issuer: https://token.actions.githubusercontent.com
    # allowed-sources is intentionally absent: it defaults to an empty map, which disables
    # OIDC publishing until a deployment maps owner/repo -> plugin id.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.epam.reportportal.marketplace: INFO
