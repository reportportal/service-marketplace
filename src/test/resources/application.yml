marketplace:
  storage:
    type: local
    local:
      root: ./build/test-marketplace
  cdn:
    base-url: http://localhost:8080/cdn
  auth:
    admin:
      username: admin
      # bcrypt of "admin" — test profile only; StartupSecurityValidator permits this under "test".
      password-hash: $2a$10$bbdLQFSI9d1QNOxWBerBceaVlOSl30P8PGK7i7bPG9bQ8jOVQIrja
    jwt:
      secret: test-secret-key-at-least-32-characters-long
      issuer: marketplace.reportportal.io
      ttl-seconds: 3600

spring:
  profiles:
    # Marks the suite as a development profile so StartupSecurityValidator permits the
    # throwaway credentials below.
    active: test
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      # This file shadows src/main/resources/application.yml on the test classpath, so the
      # publish upload limits have to be mirrored here to be exercised by integration tests.
      max-file-size: 128MB
      max-request-size: 160MB
