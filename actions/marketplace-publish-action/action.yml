name: Marketplace Publish Action
description: Publish a ReportPortal plugin bundle to service-marketplace using GitHub OIDC
author: ReportPortal
branding:
  icon: package
  color: blue

inputs:
  registry-url:
    description: Base URL of the registry (e.g. https://marketplace.reportportal.io)
    required: true
  jar-path:
    description: Path to the plugin JAR
    required: true
  plugin-id:
    description: Plugin id (required for subsequent publish; optional for first-publish when inferred from manifest)
    required: false
  first-publish:
    description: If true, POST /api/v1/plugins; otherwise POST /api/v1/plugins/{id}/versions
    required: false
    default: "false"
  changelog-path:
    description: Optional CHANGELOG.md path
    required: false
  audience:
    description: OIDC audience requested from GitHub Actions
    required: false
    default: marketplace.reportportal.io

runs:
  using: composite
  steps:
    - name: Request OIDC token and publish
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        JAR_PATH: ${{ inputs.jar-path }}
        PLUGIN_ID: ${{ inputs.plugin-id }}
        FIRST_PUBLISH: ${{ inputs.first-publish }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
        if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "Failed to obtain OIDC token" >&2
          exit 1
        fi
        BASE="${REGISTRY_URL%/}"
        FORM=(-F "jar=@${JAR_PATH}")
        if [[ -n "${CHANGELOG_PATH:-}" && -f "$CHANGELOG_PATH" ]]; then
          FORM+=(-F "changelog=@${CHANGELOG_PATH}")
        fi
        if [[ "$FIRST_PUBLISH" == "true" ]]; then
          URL="${BASE}/api/v1/plugins"
        else
          if [[ -z "${PLUGIN_ID:-}" ]]; then
            echo "plugin-id is required when first-publish=false" >&2
            exit 1
          fi
          URL="${BASE}/api/v1/plugins/${PLUGIN_ID}/versions"
        fi
        HTTP_CODE=$(curl -sS -o /tmp/marketplace-publish-response.json -w "%{http_code}" -X POST "$URL" \
          -H "Authorization: Bearer ${TOKEN}" \
          "${FORM[@]}")
        echo "HTTP ${HTTP_CODE}"
        cat /tmp/marketplace-publish-response.json
        if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
          echo "Publish failed" >&2
          exit 1
        fi
