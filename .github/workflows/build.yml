name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download modules
        run: go mod download

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race, because a torn (data, generation) read in LocalStore was a real
      # bug here and a plain `go test` cannot see its return.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o bin/marketplace ./cmd/marketplace

      - name: Docker build
        run: docker build -t service-marketplace:ci .
