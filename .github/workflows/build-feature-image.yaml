name: Build feature Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

jobs:
  variables-setup:
    name: Setting variables for docker build
    runs-on: ubuntu-latest
    if: (!startsWith(github.head_ref, 'dependabot/') || !startsWith(github.head_ref, 'rc/') || !startsWith(github.head_ref, 'hotfix/') || !startsWith(github.head_ref, 'master') || !startsWith(github.head_ref, 'main'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create variables
        id: vars
        run: |
          echo "tag=$(echo ${{ github.head_ref || github.ref_name }}-${{ github.run_number }} | tr '/' '-')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      date: ${{ steps.vars.outputs.date }}

  call-docker-build:
    name: Call feature Docker build
    needs: variables-setup
    uses: reportportal/.github/.github/workflows/build-docker-image.yaml@main
    with:
      registry: gcr
      gcr-region: ${{ vars.GCR_DEV_REGION }}
      gcp-project: ${{ vars.GCP_DEV_PROJECT }}
      build-platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64' }}
      image-tag: ${{ needs.variables-setup.outputs.tag }}
      version: ${{ needs.variables-setup.outputs.tag }}
      branch: ${{ github.head_ref || github.ref_name }}
      date: ${{ needs.variables-setup.outputs.date }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}
      GCR_REGION: ${{ secrets.GCR_DEV_REGION }}
      GCP_PROJECT: ${{ secrets.GCP_DEV_PROJECT }}
