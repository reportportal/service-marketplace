name: Build develop Docker image

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '.github/**'
      - README.md
      - actions/**
      - docs/**
      - charts/**
    workflow_dispatch:

jobs:
  variables-setup:
    name: Setting variables for docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create variables
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    outputs:
      date: ${{ steps.vars.outputs.date }}

  build-and-push:
    name: Build and push develop image to GCR
    needs: variables-setup
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GCR_REGION: ${{ secrets.GCR_DEV_REGION }}
      GCP_PROJECT: ${{ secrets.GCP_DEV_PROJECT }}
      IMAGE_REPO: service-marketplace
      IMAGE_TAG: develop-${{ github.run_number }}
      ADDITIONAL_TAG: develop-latest
      PLATFORMS: ${{ vars.BUILD_PLATFORMS || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEV_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCR_DEV_REGION }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            APP_VERSION=develop-${{ github.run_number }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ needs.variables-setup.outputs.date }}
          tags: |
            ${{ env.GCR_DEV_REGION }}/${{ env.GCP_DEV_PROJECT }}/reportportal/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.GCR_DEV_REGION }}/${{ env.GCP_DEV_PROJECT }}/reportportal/${{ env.IMAGE_REPO }}:${{ env.ADDITIONAL_TAG }}
